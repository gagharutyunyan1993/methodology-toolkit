name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate plugin & marketplace manifests
        run: node scripts/validate-manifests.mjs
      - name: Validate skill package integrity
        run: node scripts/validate-skill.mjs
      - name: Check for dangling links and paths
        run: node scripts/check-refs.mjs
      - name: Test subagent report checker
        run: node scripts/test-check-report.mjs
